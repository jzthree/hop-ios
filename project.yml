name: HopSpike
options:
  bundleIdPrefix: io.zhoulab.hop
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  HopSpike:
    type: application
    platform: iOS
    sources:
      - Sources/HopSpike
      - Sources/Shared
    dependencies:
      - package: SwiftTerm
      # - target: HopWidget   # PARKED: see the HopWidget block below
    info:
      path: Sources/HopSpike/Info.plist
      properties:
        CFBundleDisplayName: hop
        # NOTE: Info.plist is GENERATED from this block on every `make` —
        # editing Sources/HopSpike/Info.plist directly is silently discarded.
        # The Makefile passes both of these on the xcodebuild command line so
        # each install is identifiable on the device.
        # Declared once so App Store Connect stops asking on every upload. The
        # app uses only HTTPS/TLS, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HopGitDescribe: $(HOP_GIT_DESCRIBE)
        # The app forces dark mode, but a launch screen follows the SYSTEM
        # appearance — with no colour named, opening hop on a light-mode phone
        # flashed a full white screen before the dark UI appeared.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "hop locks your terminal sessions behind Face ID."
        NSLocalNetworkUsageDescription: "hop connects to your hop daemon on the local network."
        UIBackgroundModes: [fetch]
        # Handoff: the open session is donated as a browsing activity whose
        # webpageURL is hop web's own ?room= deep link — a Mac picks it up in
        # Safari; another device running this app continues natively.
        NSUserActivityTypes: [io.zhoulab.hop.session.handoff]
        BGTaskSchedulerPermittedIdentifiers: [io.zhoulab.hop.spike.refresh]
        # hop://session/<internalName> — the deep-link road for widget rows,
        # cross-app links and anything else that can open a URL.
        CFBundleURLTypes:
          - CFBundleURLName: io.zhoulab.hop.spike
            CFBundleURLSchemes: [hop]
    entitlements:
      # GENERATED from these properties — editing HopSpike.entitlements
      # directly is silently overwritten with an empty dict, exactly like
      # Info.plist. Same trap, second time.
      path: HopSpike.entitlements
      properties:
        # Per-configuration: a TestFlight/App Store build MUST say production,
        # or the app registers against sandbox APNs and real pushes never
        # arrive. Debug keeps development so a cabled build still works.
        aps-environment: $(APS_ENVIRONMENT)
        # PARKED with the widget: the App Group entitlement needs a
        # provisioning identity this machine doesn't have (see below).
        # com.apple.security.application-groups: [group.io.zhoulab.hop.spike]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hop.spike
        DEVELOPMENT_TEAM: 5AD7QB9795
        APS_ENVIRONMENT: development
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          APS_ENVIRONMENT: production
  # PARKED, fully written and sim-verified: the Home Screen widget. Blocked
  # on provisioning only — xcodebuild has NO signed-in account ("No
  # Accounts"), and the ASC API key is rejected ("Authentication failed:
  # bearer token"), so neither path can register the App Group or mint the
  # widget profile. To unblock, EITHER sign into Xcode (Settings → Accounts,
  # team 5AD7QB9795) OR give the ASC key an Admin role — then uncomment this
  # target, the `- target: HopWidget` dependency and both app-group
  # entitlement lines, and `make install`.
  # HopWidgetPARKED:
  #   type: app-extension
  #   platform: iOS
  #   sources:
  #     - Widget
  #     - Sources/Shared
  #   info:
  #     path: Widget/Info.plist
  #     properties:
  #       CFBundleDisplayName: hop
  #       NSExtension:
  #         NSExtensionPointIdentifier: com.apple.widgetkit-extension
  #   entitlements:
  #     path: HopWidget.entitlements
  #     properties:
  #       com.apple.security.application-groups: [group.io.zhoulab.hop.spike]
  #   settings:
  #     base:
  #       PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hop.spike.widget
  #       DEVELOPMENT_TEAM: 5AD7QB9795
  #       CODE_SIGN_STYLE: Automatic
  #       SWIFT_VERSION: "5.9"
  #       TARGETED_DEVICE_FAMILY: "1"
  #       SKIP_INSTALL: YES
  HopSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HopSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hop.spike.tests
        DEVELOPMENT_TEAM: 5AD7QB9795
        GENERATE_INFOPLIST_FILE: YES
  HopSpikeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HopSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hop.spike.uitests
        DEVELOPMENT_TEAM: 5AD7QB9795
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HopSpike
schemes:
  HopSpike:
    build:
      targets:
        HopSpike: all
        HopSpikeTests: [test]
    test:
      targets: [HopSpikeTests]
    # Explicit, because XcodeGen's default for an unspecified archive config
    # turned out to be DEBUG: `make testflight` archived an unoptimised build
    # with aps-environment=development — which TestFlight would sign but push
    # could never reach — and ExportOptions uploads straight from the archive.
    # Caught in a dry run before the first real upload spent it.
    archive:
      config: Release
    run:
      config: Debug
  HopSpikeUI:
    build:
      targets:
        HopSpike: all
        HopSpikeUITests: [test]
    test:
      targets: [HopSpikeUITests]
