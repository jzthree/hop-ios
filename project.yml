name: HopSpike
options:
  bundleIdPrefix: io.zhoulab.hop
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  HopSpike:
    type: application
    platform: iOS
    sources:
      - Sources/HopSpike
      - Sources/Shared
    dependencies:
      - package: SwiftTerm
      # - target: HopWidget   # RE-PARKED: empty Xcode account list, see below
    info:
      path: Sources/HopSpike/Info.plist
      properties:
        CFBundleDisplayName: hop
        # NOTE: Info.plist is GENERATED from this block on every `make` —
        # editing Sources/HopSpike/Info.plist directly is silently discarded.
        # The Makefile passes both of these on the xcodebuild command line so
        # each install is identifiable on the device.
        # Declared once so App Store Connect stops asking on every upload. The
        # app uses only HTTPS/TLS, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HopGitDescribe: $(HOP_GIT_DESCRIBE)
        # The app forces dark mode, but a launch screen follows the SYSTEM
        # appearance — with no colour named, opening hop on a light-mode phone
        # flashed a full white screen before the dark UI appeared.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "hop locks your terminal sessions behind Face ID."
        NSLocalNetworkUsageDescription: "hop connects to your hop daemon on the local network."
        UIBackgroundModes: [fetch]
        # Handoff: the open session is donated as a browsing activity whose
        # webpageURL is hop web's own ?room= deep link — a Mac picks it up in
        # Safari; another device running this app continues natively.
        NSUserActivityTypes: [io.zhoulab.hop.session.handoff]
        BGTaskSchedulerPermittedIdentifiers: [io.zhoulab.hop.spike.refresh]
        # hop://session/<internalName> — the deep-link road for widget rows,
        # cross-app links and anything else that can open a URL.
        CFBundleURLTypes:
          - CFBundleURLName: io.zhoulab.hop.spike
            CFBundleURLSchemes: [hop]
    entitlements:
      # GENERATED from these properties — editing HopSpike.entitlements
      # directly is silently overwritten with an empty dict, exactly like
      # Info.plist. Same trap, second time.
      path: HopSpike.entitlements
      properties:
        # Per-configuration: a TestFlight/App Store build MUST say production,
        # or the app registers against sandbox APNs and real pushes never
        # arrive. Debug keeps development so a cabled build still works.
        aps-environment: $(APS_ENVIRONMENT)
        # Native passkey (Face ID) sign-in. The daemon serves the matching
        # /.well-known/apple-app-site-association naming this team+bundle;
        # Apple's CDN cross-checks the pair. Static by nature: a passkey
        # against any OTHER hop server needs its domain added here.
        #
        # The wildcard covers per-user subdomains, which is where an instance
        # lives once the bare domain becomes a public landing page. WebAuthn
        # treats each hostname as its own relying party, so without the
        # subdomain entry a moved server has zero enrolled passkeys and no
        # way to enroll one. Wildcards need iOS 14+ and a rebuild —
        # entitlements ship in the binary, so this must land in a build
        # BEFORE the server moves.
        com.apple.developer.associated-domains:
          - webcredentials:hop.zhoulab.io
          # Users live FLAT under the zone (hop-<name>.zhoulab.io) — the
          # nested *.hop.zhoulab.io fails TLS under Cloudflare's universal
          # cert, so it can never be a hop hostname. The zone wildcard covers
          # every registrant's subdomain (and kat.zhoulab.io) in one line.
          - webcredentials:*.zhoulab.io
        # RE-PARKED with the widget 2026-07-29 (second attempt): the sign-in
        # did not stick — defaults read com.apple.dt.Xcode
        # DVTDeveloperAccountManagerAppleIDLists shows an EMPTY account list
        # (the 5AD7QB9795 team entry is a stale remnant). Jian: Xcode →
        # Settings → Accounts → "+" → sign in with the Apple ID owning team
        # 5AD7QB9795, and confirm the account LISTS afterwards.
        # com.apple.security.application-groups: [group.io.zhoulab.hop.spike]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hop.spike
        DEVELOPMENT_TEAM: 5AD7QB9795
        APS_ENVIRONMENT: development
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          APS_ENVIRONMENT: production
  # RE-PARKED 2026-07-29: build failed "No Accounts" — the account list is
  # EMPTY (stale team entry only). Uncomment this target, the dependency
  # above, and both app-group lines after a sign-in that sticks.
  HopWidgetPARKED:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Sources/Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: hop
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HopWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.zhoulab.hop.spike]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hop.spike.widget
        DEVELOPMENT_TEAM: 5AD7QB9795
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  HopSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HopSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hop.spike.tests
        DEVELOPMENT_TEAM: 5AD7QB9795
        GENERATE_INFOPLIST_FILE: YES
  HopSpikeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HopSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hop.spike.uitests
        DEVELOPMENT_TEAM: 5AD7QB9795
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HopSpike
schemes:
  HopSpike:
    build:
      targets:
        HopSpike: all
        HopSpikeTests: [test]
    test:
      targets: [HopSpikeTests]
    # Explicit, because XcodeGen's default for an unspecified archive config
    # turned out to be DEBUG: `make testflight` archived an unoptimised build
    # with aps-environment=development — which TestFlight would sign but push
    # could never reach — and ExportOptions uploads straight from the archive.
    # Caught in a dry run before the first real upload spent it.
    archive:
      config: Release
    run:
      config: Debug
  HopSpikeUI:
    build:
      targets:
        HopSpike: all
        HopSpikeUITests: [test]
    test:
      targets: [HopSpikeUITests]
